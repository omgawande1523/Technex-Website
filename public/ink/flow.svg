<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <!-- Marbled gold-ink texture shown through the hero wordmark (background-clip:text).
       Tileable horizontally via stitchTiles. Placeholder until real ink footage is shot. -->
  <filter id="marble" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.011" numOctaves="5" seed="26" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="
      0 0 0 0 0.85
      0 0 0 0 0.68
      0 0 0 0 0.38
      2.6 0 0 0 -0.95" result="gold"/>
    <feTurbulence type="turbulence" baseFrequency="0.02 0.05" numOctaves="2" seed="7" stitchTiles="stitch" result="fine"/>
    <feDisplacementMap in="gold" in2="fine" scale="38" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <rect width="1200" height="600" fill="#2a1f10"/>
  <rect width="1200" height="600" filter="url(#marble)"/>
</svg>
